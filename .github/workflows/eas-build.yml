name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil de build (eas.json)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bump version
        run: node ./scripts/bump-version.js

      - name: EAS Build
        run: eas build --profile ${{ inputs.profile }} --non-interactive --no-wait
